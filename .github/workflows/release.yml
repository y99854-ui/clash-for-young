# 自动打包：Mac 通用版（Intel + Apple 芯片）和 Windows 安装包，并附到对应的 GitHub 发布页。
# 触发方式：
#   1. 推送 v 开头的标签（如 git tag v0.1.0 && git push origin v0.1.0）
#   2. 在仓库 Actions 页面手动运行，填入发布标签
name: 打包发布

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，如 v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  # 先建好发布页，两个打包任务再往里放文件。
  # 以前两个任务各自建发布页，同时完成时会撞车（already_exists），其中一个失败。
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 创建发布页
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "发布页 $TAG 已存在"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Clash for Young $TAG" --notes-file release-notes.md
          fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # 编译进软件，显示在设置页底部
      CFY_VERSION: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      # 软件内自动更新按版本号比较新旧：发布标签 v6714 写成 0.0.6714
      # （Windows 安装包要求主版本号 ≤ 255，所以数字放在最后一位）
      - name: 写入版本号
        shell: bash
        run: |
          N="${TAG#v}"
          if ! [[ "$N" =~ ^[0-9]+$ ]]; then echo "发布标签必须是 v 加数字，如 v6714（现在是 $TAG）"; exit 1; fi
          node -e "const f='src-tauri/tauri.conf.json';const c=require('./'+f);c.version='0.0.$N';require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          grep '"version"' src-tauri/tauri.conf.json

      # 由小猫原图生成各尺寸的应用图标（icns / ico / png）
      - run: npx tauri icon src-tauri/icons/app-icon.png

      # 下载 mihomo 内核和地理数据，打进安装包
      - run: node scripts/fetch-deps.mjs --target ${{ matrix.target }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 单元测试（只在 Mac 上跑一次）
      - if: matrix.platform == 'macos-latest'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 发布说明：仓库根目录的 release-notes.md（每次发版前改写）
      - name: 读取发布说明
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            cat release-notes.md 2>/dev/null || true
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 给更新包签名的私钥（仓库 Settings → Secrets 里的 TAURI_SIGNING_PRIVATE_KEY）。
          # 软件里内置对应的公钥，只安装用这把私钥签过的更新包。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: Clash for Young ${{ env.TAG }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          args: ${{ matrix.args }}
          assetNamePattern: clash-for-young_${{ env.TAG }}_[arch][setup][ext]
          # 生成 latest.json（软件检查更新时读它）；Windows 用 setup.exe 那种安装包更新
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
